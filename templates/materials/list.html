{% extends 'base.html' %}

{% block title %}
    Materials · FigureForge
{% endblock %}

{% block content %}
    <section class="container section">

        <h1>Materials</h1>

        <div class="grid">

            {% for material in materials %}

                <article class="card">

                    <h3>
                        {{ material }}
                    </h3>

                </article>

            {% empty %}

                <p>
                    No materials found.
                </p>

            {% endfor %}

        </div>

    </section>
{% endblock %}
