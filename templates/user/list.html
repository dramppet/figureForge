{% extends 'base.html' %}

{% block title %}
    Requests · FigureForge
{% endblock %}

{% block content %}
    <section class="container section">

        <h1>Requests</h1>

        <div class="grid">

            {% for item in objects %}

                <article class="card">
                    {{ item }}
                </article>

            {% empty %}

                <p>
                    No requests found.
                </p>

            {% endfor %}

        </div>

    </section>
{% endblock %}
