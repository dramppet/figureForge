
{% load static %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            FigureForge
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/figureforge.css' %}"
    >
</head>

<body>

    <header class="site-header">
        <div class="container nav">

            <a
                class="brand"
                href="{% url 'common:home-page' %}"
            >
                Figure<span>Forge</span>
            </a>

            <nav aria-label="Main navigation">

                <a href="{% url 'common:home-page' %}">
                    Home
                </a>

                <a href="{% url 'figures:list' %}">
                    Figures
                </a>

                <a href="{% url 'manufacturers:list' %}">
                    Manufacturers
                </a>

                <a href="{% url 'materials:list' %}">
                    Materials
                </a>

                <a href="{% url 'reviews:list' %}">
                    Reviews
                </a>

                <a href="{% url 'user:list' %}">
                    Requests
                </a>

            </nav>
        </div>
    </header>

    <main
        class="container"
        id="main-content"
    >
        {% block content %}
        {% endblock %}
    </main>

    {% include 'shared/footer.html' %}

</body>
</html>
