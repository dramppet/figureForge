
{% csrf_token %}

{% for field in form %}
    <div class="form-field">

        <label for="{{ field.id_for_label }}">
            {{ field.label }}

            {% if field.field.required %}
                *
            {% endif %}
        </label>

        {{ field }}

        {% if field.help_text %}
            <small class="muted">
                {{ field.help_text }}
            </small>
        {% endif %}

        {% for error in field.errors %}
            <small role="alert">
                {{ error }}
            </small>
        {% endfor %}

    </div>
{% endfor %}

{% if form.non_field_errors %}
    <div role="alert">
        {{ form.non_field_errors }}
    </div>
{% endif %}
