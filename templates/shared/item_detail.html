{% extends 'base.html' %}
{% load figureforge_tags %}


{% block title %}
    Details · FigureForge
{% endblock %}

{% block content %}
    <select name="sort">
         <option value="">Default</option>

    {% if section == 'figures' %}
        <option value="title"
            {% if request.GET.sort == 'title' %}selected{% endif %}>
            Title A–Z
        </option>

        <option value="-title"
            {% if request.GET.sort == '-title' %}selected{% endif %}>
            Title Z–A
        </option>

        <option value="base_price"
            {% if request.GET.sort == 'base_price' %}selected{% endif %}>
            Price: Low to High
        </option>

        <option value="-base_price"
            {% if request.GET.sort == '-base_price' %}selected{% endif %}>
            Price: High to Low
        </option>

    {% elif section == 'manufacturers' or section == 'materials' %}
        <option value="name"
            {% if request.GET.sort == 'name' %}selected{% endif %}>
            Name A–Z
        </option>

        <option value="-name"
            {% if request.GET.sort == '-name' %}selected{% endif %}>
            Name Z–A
        </option>
    {% endif %}

    <option value="-pk"
        {% if request.GET.sort == '-pk' %}selected{% endif %}>
        Newest
    </option>
</select>
{% endblock %}
